<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Steel & Ceramic Gradients -->
    <linearGradient id="diverSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d4d8de"/>
      <stop offset="50%" stop-color="#8e949c"/>
      <stop offset="75%" stop-color="#e9ecf0"/>
      <stop offset="100%" stop-color="#9ca2ab"/>
    </linearGradient>
    <radialGradient id="abyssBlueDial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#183b5c"/>
      <stop offset="60%" stop-color="#0a1d33"/>
      <stop offset="100%" stop-color="#03080e"/>
    </radialGradient>
    <linearGradient id="ceramicBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122538"/>
      <stop offset="50%" stop-color="#081420"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <filter id="watchShadowDiver" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#watchShadowDiver)">
    <!-- Top Steel Bracelet -->
    <path d="M 175 40 L 325 40 L 320 180 L 180 180 Z" fill="url(#diverSteel)" stroke="#6b727d" stroke-width="1.5"/>
    <line x1="176" y1="80" x2="324" y2="80" stroke="#5b616b" stroke-width="2"/>
    <line x1="178" y1="120" x2="322" y2="120" stroke="#5b616b" stroke-width="2"/>
    <line x1="179" y1="155" x2="321" y2="155" stroke="#5b616b" stroke-width="2"/>

    <!-- Bottom Steel Bracelet -->
    <path d="M 180 520 L 320 520 L 325 660 L 175 660 Z" fill="url(#diverSteel)" stroke="#6b727d" stroke-width="1.5"/>
    <line x1="179" y1="545" x2="321" y2="545" stroke="#5b616b" stroke-width="2"/>
    <line x1="178" y1="580" x2="322" y2="580" stroke="#5b616b" stroke-width="2"/>
    <line x1="176" y1="620" x2="324" y2="620" stroke="#5b616b" stroke-width="2"/>

    <!-- Rugged Diver Case Body & Crown Guards -->
    <path d="M 155 210 C 155 160 345 160 345 210 L 375 270 C 395 310 395 390 375 430 L 345 490 C 345 540 155 540 155 490 L 125 430 C 105 390 105 310 125 270 Z" 
          fill="url(#diverSteel)" stroke="#4d535b" stroke-width="2"/>

    <!-- Screw-Down Crown with Guards at 3 o'clock -->
    <path d="M 370 325 L 404 332 L 404 368 L 370 375 Z" fill="url(#diverSteel)" stroke="#333" stroke-width="1.5"/>
    <rect x="385" y="335" width="16" height="30" rx="3" fill="url(#diverSteel)" stroke="#222" stroke-width="1"/>

    <!-- Helium Escape Valve at 10 o'clock -->
    <rect x="115" y="275" width="12" height="18" rx="2" fill="url(#diverSteel)" stroke="#333" stroke-width="1"/>

    <!-- Outer Fluted Grip Ceramic Bezel (120-click) -->
    <circle cx="250" cy="350" r="144" fill="url(#diverSteel)" stroke="#444" stroke-width="2"/>
    <!-- Ceramic Bezel Insert (Deep Blue / Black) -->
    <circle cx="250" cy="350" r="138" fill="url(#ceramicBezel)" stroke="#02060c" stroke-width="1"/>
    
    <!-- Luminous Diving Pip at 12 o'clock -->
    <polygon points="250,214 243,225 257,225" fill="#ffffff" stroke="#DA291C" stroke-width="1"/>
    <circle cx="250" cy="221" r="2.5" fill="#00e5ff"/>

    <!-- Bezel Numeric Markers (10, 20, 30, 40, 50) -->
    <text x="325" y="258" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">10</text>
    <text x="368" y="355" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">20</text>
    <text x="325" y="452" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">30</text>
    <text x="175" y="452" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">40</text>
    <text x="132" y="355" font-family="'Montserrat', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">50</text>

    <!-- Inner Steel Flange (Rehaut) -->
    <circle cx="250" cy="350" r="124" fill="none" stroke="url(#diverSteel)" stroke-width="3"/>

    <!-- Deep Abyss Blue Dial -->
    <circle cx="250" cy="350" r="121" fill="url(#abyssBlueDial)"/>

    <!-- Brand Typography on Dial -->
    <text x="250" y="278" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">VOUVRY</text>
    <text x="250" y="290" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#8cb5db" text-anchor="middle" letter-spacing="2.5">GENÈVE</text>
    
    <text x="250" y="415" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">NAUTILUS DIVER</text>
    <text x="250" y="426" font-family="'Montserrat', sans-serif" font-size="6" font-weight="600" fill="#00e5ff" text-anchor="middle" letter-spacing="2">1000ft = 300m</text>
    <text x="250" y="435" font-family="'Montserrat', sans-serif" font-size="5" font-weight="600" fill="#8cb5db" text-anchor="middle" letter-spacing="1">CHRONOMETER OFFICIALLY CERTIFIED</text>

    <!-- Date Window at 3 o'clock with Magnifier Cyclops -->
    <rect x="320" y="340" width="24" height="18" fill="#ffffff" stroke="#000" stroke-width="1.5" rx="2"/>
    <text x="332" y="354" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#111" text-anchor="middle">10</text>

    <!-- Maxi Luminous Indices (Super-LumiNova BGW9 Aqua-Blue glow) -->
    <!-- 12 o'clock inverted triangle -->
    <polygon points="250,248 240,232 260,232" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="250" cy="237" r="3" fill="#00e5ff"/>
    <!-- 6 & 9 o'clock rectangles -->
    <rect x="244" y="445" width="12" height="18" rx="2" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="135" y="344" width="18" height="12" rx="2" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Circles at 1, 2, 4, 5, 7, 8, 10, 11 -->
    <circle cx="310" cy="275" r="8" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="342" cy="310" r="8" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="342" cy="390" r="8" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="310" cy="425" r="8" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="190" cy="425" r="8" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="158" cy="390" r="8" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="158" cy="310" r="8" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="190" cy="275" r="8" fill="#e8f8ff" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Luminous Hands: Mercedes / Sword style -->
    <!-- Hour Hand -->
    <polygon points="250,350 196,302 200,298 252,348" fill="#ffffff" stroke="#444" stroke-width="1"/>
    <circle cx="212" cy="315" r="7" fill="#ffffff" stroke="#444" stroke-width="1"/>
    <circle cx="212" cy="315" r="5" fill="#00e5ff"/>

    <!-- Minute Hand -->
    <polygon points="250,350 332,284 329,280 248,348" fill="#ffffff" stroke="#444" stroke-width="1"/>
    <polygon points="252,346 322,292 320,289 250,344" fill="#00e5ff"/>

    <!-- Lollipop Seconds Hand with Red Tip -->
    <line x1="250" y1="375" x2="250" y2="234" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="250" cy="265" r="5.5" fill="#00e5ff" stroke="#ffffff" stroke-width="1"/>
    <line x1="250" y1="242" x2="250" y2="234" stroke="#DA291C" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="250" cy="350" r="4.5" fill="#ffffff"/>
    <circle cx="250" cy="350" r="2" fill="#0a1d33"/>

    <!-- Sapphire Reflection -->
    <path d="M 145 270 Q 250 220 355 270 A 121 121 0 0 0 145 270 Z" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
