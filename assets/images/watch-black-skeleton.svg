<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Dark DLC Titanium Gradients -->
    <linearGradient id="dlcCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#323338"/>
      <stop offset="30%" stop-color="#1c1d20"/>
      <stop offset="70%" stop-color="#121315"/>
      <stop offset="100%" stop-color="#2a2b30"/>
    </linearGradient>
    <linearGradient id="burgundyRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a1824"/>
      <stop offset="50%" stop-color="#580f17"/>
      <stop offset="100%" stop-color="#73141e"/>
    </linearGradient>
    <linearGradient id="goldGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae19c"/>
      <stop offset="50%" stop-color="#cda34f"/>
      <stop offset="100%" stop-color="#8c6c29"/>
    </linearGradient>
    <linearGradient id="blackRubberStrap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1b1e"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <pattern id="strapPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 L 8 0 L 16 8 L 8 16 Z" fill="#1e1e23"/>
      <path d="M 8 8 L 12 4 L 16 8 L 12 12 Z" fill="#141418"/>
    </pattern>
    <filter id="watchShadowBlack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#watchShadowBlack)">
    <!-- Top Rubber Strap -->
    <path d="M 175 40 L 325 40 L 320 180 L 180 180 Z" fill="url(#blackRubberStrap)" stroke="#222" stroke-width="1.5"/>
    <rect x="175" y="40" width="150" height="140" fill="url(#strapPattern)" opacity="0.35"/>
    <!-- Central Embossed Ridge -->
    <line x1="250" y1="40" x2="250" y2="180" stroke="#000000" stroke-width="3"/>

    <!-- Bottom Rubber Strap -->
    <path d="M 180 520 L 320 520 L 325 660 L 175 660 Z" fill="url(#blackRubberStrap)" stroke="#222" stroke-width="1.5"/>
    <rect x="175" y="520" width="150" height="140" fill="url(#strapPattern)" opacity="0.35"/>
    <line x1="250" y1="520" x2="250" y2="660" stroke="#000000" stroke-width="3"/>

    <!-- Case Body & Lugs (Angular DLC Tonneau) -->
    <path d="M 158 208 C 158 165 342 165 342 208 L 372 278 C 388 318 388 382 372 422 L 342 492 C 342 535 158 535 158 492 L 128 422 C 112 382 112 318 128 278 Z" 
          fill="url(#dlcCase)" stroke="#090a0c" stroke-width="2.5"/>

    <!-- Crown at 3 o'clock -->
    <path d="M 384 335 L 404 338 L 404 362 L 384 365 Z" fill="url(#dlcCase)" stroke="#000" stroke-width="1.5"/>
    <rect x="390" y="337" width="10" height="26" fill="#8a1824" opacity="0.8"/>

    <!-- Outer Bezel Ring -->
    <circle cx="250" cy="350" r="142" fill="#1b1c20" stroke="#33343a" stroke-width="2"/>
    <circle cx="250" cy="350" r="130" fill="#0d0e10" stroke="#000" stroke-width="2"/>

    <!-- Burgundy Architectural Inner Ring -->
    <circle cx="250" cy="350" r="126" fill="none" stroke="url(#burgundyRing)" stroke-width="9"/>
    
    <!-- Skeleton Movement Interior Base -->
    <circle cx="250" cy="350" r="121" fill="#111215"/>

    <!-- Exposed Mechanical Gears & Skeleton Bridges -->
    <!-- Gear 1 (Mainspring Barrel at 12 o'clock) -->
    <circle cx="250" cy="285" r="32" fill="#1e1f24" stroke="url(#goldGear)" stroke-width="1.5"/>
    <circle cx="250" cy="285" r="28" fill="none" stroke="#3d3e45" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="250" cy="285" r="12" fill="#16171b" stroke="#777" stroke-width="1"/>
    <!-- Ruby jewel -->
    <circle cx="250" cy="285" r="4" fill="#d11a4b"/>

    <!-- Gear 2 (Escapement & Balance Wheel at 7-8 o'clock) -->
    <circle cx="205" cy="390" r="34" fill="none" stroke="url(#goldGear)" stroke-width="2.5"/>
    <circle cx="205" cy="390" r="24" fill="none" stroke="#e0c279" stroke-width="1"/>
    <!-- Balance spokes -->
    <line x1="205" y1="366" x2="205" y2="414" stroke="#e0c279" stroke-width="1.5"/>
    <line x1="181" y1="390" x2="229" y2="390" stroke="#e0c279" stroke-width="1.5"/>
    <circle cx="205" cy="390" r="7" fill="#1e1f24" stroke="#cda34f" stroke-width="1"/>
    <circle cx="205" cy="390" r="3" fill="#d11a4b"/>

    <!-- Gear 3 (Intermediate Drive Train at 4 o'clock) -->
    <circle cx="295" cy="385" r="26" fill="#1a1b20" stroke="url(#goldGear)" stroke-width="1.2"/>
    <circle cx="295" cy="385" r="5" fill="#222" stroke="#d11a4b" stroke-width="1"/>

    <!-- Angular Structural Black Bridges / Calibre skeleton arms -->
    <path d="M 160 350 L 225 350 L 250 380 L 280 320 L 340 320" fill="none" stroke="#2c2d33" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 250 250 L 250 320 L 220 350" fill="none" stroke="#222328" stroke-width="6"/>

    <!-- Brand Typography (Suspended on inner crystal) -->
    <text x="250" y="240" font-family="'Montserrat', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">VOUVRY</text>
    <text x="250" y="250" font-family="'Montserrat', sans-serif" font-size="6" font-weight="600" fill="#b0b0b8" text-anchor="middle" letter-spacing="2">SKELETON AUTOMATIC</text>

    <!-- Hour Markers (Luminescent indices on burgundy chapter ring) -->
    <rect x="248" y="225" width="4" height="12" rx="1" fill="#ffffff" stroke="#8a1824" stroke-width="0.5"/>
    <rect x="363" y="348" width="12" height="4" rx="1" fill="#ffffff" stroke="#8a1824" stroke-width="0.5"/>
    <rect x="125" y="348" width="12" height="4" rx="1" fill="#ffffff" stroke="#8a1824" stroke-width="0.5"/>
    <rect x="248" y="463" width="4" height="12" rx="1" fill="#ffffff" stroke="#8a1824" stroke-width="0.5"/>

    <!-- Skeleton Hands (Super-LumiNova filled) -->
    <!-- Hour Hand -->
    <polygon points="250,350 195,302 198,298 252,348" fill="#e8eaed" stroke="#111" stroke-width="1"/>
    <polygon points="246,346 205,310 207,308 248,344" fill="#00f0ff" opacity="0.3"/>

    <!-- Minute Hand -->
    <polygon points="250,350 332,286 329,282 248,348" fill="#e8eaed" stroke="#111" stroke-width="1"/>
    <polygon points="252,346 322,294 320,291 250,344" fill="#00f0ff" opacity="0.3"/>

    <!-- Seconds Hand (Burgundy / Red Accent with Counterweight) -->
    <line x1="250" y1="375" x2="250" y2="232" stroke="#DA291C" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="250" cy="350" r="4.5" fill="#DA291C"/>
    <circle cx="250" cy="350" r="2" fill="#111"/>

    <!-- Sapphire Reflection -->
    <path d="M 145 270 Q 250 220 355 270 A 126 126 0 0 0 145 270 Z" fill="#ffffff" opacity="0.08"/>
  </g>
</svg>
