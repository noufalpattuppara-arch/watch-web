<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Steel Gradients -->
    <linearGradient id="leatherSteelCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d6dadf"/>
      <stop offset="50%" stop-color="#8a9099"/>
      <stop offset="75%" stop-color="#e2e5ea"/>
      <stop offset="100%" stop-color="#9ea3ac"/>
    </linearGradient>
    <!-- Rich Brown Leather Strap Gradients -->
    <linearGradient id="brownLeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d150e"/>
      <stop offset="20%" stop-color="#4a261a"/>
      <stop offset="50%" stop-color="#381b12"/>
      <stop offset="80%" stop-color="#4a261a"/>
      <stop offset="100%" stop-color="#2d150e"/>
    </linearGradient>
    <radialGradient id="porcelainDial2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </radialGradient>
    <linearGradient id="dauphineHand2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e5e8"/>
      <stop offset="50%" stop-color="#a0a5ad"/>
      <stop offset="100%" stop-color="#60656e"/>
    </linearGradient>
    <filter id="watchShadowLeather" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#watchShadowLeather)">
    <!-- Top Brown Alligator Leather Strap -->
    <path d="M 180 40 L 320 40 L 315 185 L 185 185 Z" fill="url(#brownLeather)" stroke="#1a0c08" stroke-width="1.5"/>
    <!-- Alligator scales texture & saddle stitch -->
    <line x1="188" y1="40" x2="191" y2="185" stroke="#7a3d28" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="312" y1="40" x2="309" y2="185" stroke="#7a3d28" stroke-width="1.2" stroke-dasharray="3,3"/>
    <!-- Scale pattern lines -->
    <path d="M 195 70 Q 250 80 305 70" stroke="#1c0e09" stroke-width="1.5" fill="none"/>
    <path d="M 195 110 Q 250 120 305 110" stroke="#1c0e09" stroke-width="1.5" fill="none"/>
    <path d="M 195 150 Q 250 155 305 150" stroke="#1c0e09" stroke-width="1.5" fill="none"/>
    <line x1="240" y1="70" x2="242" y2="110" stroke="#1c0e09" stroke-width="1.2"/>
    <line x1="265" y1="110" x2="263" y2="150" stroke="#1c0e09" stroke-width="1.2"/>

    <!-- Bottom Brown Alligator Leather Strap -->
    <path d="M 185 515 L 315 515 L 310 660 C 310 660 250 670 190 660 Z" fill="url(#brownLeather)" stroke="#1a0c08" stroke-width="1.5"/>
    <line x1="191" y1="515" x2="196" y2="655" stroke="#7a3d28" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="309" y1="515" x2="304" y2="655" stroke="#7a3d28" stroke-width="1.2" stroke-dasharray="3,3"/>
    <!-- Strap Holes -->
    <circle cx="250" cy="550" r="3" fill="#150a06"/>
    <circle cx="250" cy="580" r="3" fill="#150a06"/>
    <circle cx="250" cy="610" r="3" fill="#150a06"/>
    <circle cx="250" cy="640" r="3" fill="#150a06"/>
    <!-- Scales -->
    <path d="M 195 535 Q 250 540 305 535" stroke="#1c0e09" stroke-width="1.5" fill="none"/>
    <path d="M 195 570 Q 250 575 305 570" stroke="#1c0e09" stroke-width="1.5" fill="none"/>
    <path d="M 198 625 Q 250 630 302 625" stroke="#1c0e09" stroke-width="1.5" fill="none"/>

    <!-- Classic Round Case with Elegant Slender Lugs -->
    <path d="M 160 200 C 160 170 190 160 210 160 L 290 160 C 310 160 340 170 340 200 L 365 260 C 385 300 385 400 365 440 L 340 500 C 340 530 310 540 290 540 L 210 540 C 190 540 160 530 160 500 L 135 440 C 115 400 115 300 135 260 Z" 
          fill="url(#leatherSteelCase)" stroke="#4d535d" stroke-width="2"/>

    <!-- Fluted Onion / Vintage Crown at 3 o'clock -->
    <path d="M 382 338 C 395 338 402 342 402 350 C 402 358 395 362 382 362 Z" fill="url(#leatherSteelCase)" stroke="#3a4049" stroke-width="1.5"/>
    <line x1="388" y1="340" x2="388" y2="360" stroke="#2a3039" stroke-width="1"/>
    <line x1="394" y1="341" x2="394" y2="359" stroke="#2a3039" stroke-width="1"/>

    <!-- Polished Round Bezel -->
    <circle cx="250" cy="350" r="142" fill="url(#leatherSteelCase)" stroke="#6c727c" stroke-width="2"/>
    <circle cx="250" cy="350" r="132" fill="#ffffff" stroke="#a2a7b0" stroke-width="1.5"/>

    <!-- Pure White Porcelain Dial -->
    <circle cx="250" cy="350" r="128" fill="url(#porcelainDial2)"/>

    <!-- Minute Rail Track & Arabic Numbers (05, 10, 15... 60) -->
    <circle cx="250" cy="350" r="122" fill="none" stroke="#222" stroke-width="0.8"/>
    <circle cx="250" cy="350" r="114" fill="none" stroke="#222" stroke-width="0.6"/>

    <!-- 60 Minute Track Marks -->
    <g stroke="#1a1a1c" stroke-width="1">
      <line x1="250" y1="228" x2="250" y2="236"/>
      <line x1="250" y1="464" x2="250" y2="472"/>
      <line x1="128" y1="350" x2="136" y2="350"/>
      <line x1="364" y1="350" x2="372" y2="350"/>
    </g>

    <!-- Minute Arabic Labels around rail -->
    <text x="250" y="243" font-family="'Montserrat', sans-serif" font-size="7" font-weight="600" fill="#222" text-anchor="middle">60</text>
    <text x="305" y="258" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">05</text>
    <text x="345" y="298" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">10</text>
    <text x="360" y="352" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">15</text>
    <text x="345" y="405" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">20</text>
    <text x="305" y="446" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">25</text>
    <text x="250" y="460" font-family="'Montserrat', sans-serif" font-size="7" font-weight="600" fill="#222" text-anchor="middle">30</text>
    <text x="195" y="446" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">35</text>
    <text x="155" y="405" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">40</text>
    <text x="140" y="352" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">45</text>
    <text x="155" y="298" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">50</text>
    <text x="195" y="258" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#222" text-anchor="middle">55</text>

    <!-- Traditional Bold Black Roman Numerals -->
    <!-- XII -->
    <text x="250" y="272" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" fill="#050505" text-anchor="middle">XII</text>
    <!-- I -->
    <text x="300" y="286" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">I</text>
    <!-- II -->
    <text x="334" y="322" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">II</text>
    <!-- III -->
    <text x="345" y="357" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">III</text>
    <!-- IV -->
    <text x="334" y="394" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">IV</text>
    <!-- V -->
    <text x="300" y="428" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">V</text>
    <!-- VI -->
    <text x="250" y="442" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#050505" text-anchor="middle">VI</text>
    <!-- VII -->
    <text x="198" y="428" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">VII</text>
    <!-- VIII -->
    <text x="162" y="394" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" fill="#050505" text-anchor="middle">VIII</text>
    <!-- IX -->
    <text x="150" y="357" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">IX</text>
    <!-- X -->
    <text x="162" y="322" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">X</text>
    <!-- XI -->
    <text x="198" y="286" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#050505" text-anchor="middle">XI</text>

    <!-- Brand Typography on Dial -->
    <text x="250" y="305" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#050505" text-anchor="middle" letter-spacing="2.5">VOUVRY</text>
    <text x="250" y="318" font-family="'Montserrat', sans-serif" font-size="7" font-weight="600" fill="#555" text-anchor="middle" letter-spacing="2">AUTOMATIC</text>

    <!-- Date Window at 3 o'clock with Box Border -->
    <rect x="312" y="341" width="22" height="17" fill="#ffffff" stroke="#333" stroke-width="1.2" rx="1"/>
    <text x="323" y="354" font-family="'Montserrat', sans-serif" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">8</text>

    <!-- Swiss Made at 6 o'clock -->
    <text x="250" y="454" font-family="'Montserrat', sans-serif" font-size="5" font-weight="700" fill="#333" text-anchor="middle" letter-spacing="1.5">SWISS 30 MADE</text>

    <!-- Faceted Dauphine Hands -->
    <polygon points="250,350 185,296 200,328 250,350" fill="url(#dauphineHand2)" stroke="#4d535d" stroke-width="0.8"/>
    <polygon points="250,350 185,296 206,322 250,350" fill="#ffffff" opacity="0.6"/>

    <polygon points="250,350 338,280 322,308 250,350" fill="url(#dauphineHand2)" stroke="#4d535d" stroke-width="0.8"/>
    <polygon points="250,350 338,280 328,302 250,350" fill="#ffffff" opacity="0.6"/>

    <!-- Central Needle Seconds Hand -->
    <line x1="250" y1="375" x2="250" y2="236" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="250" cy="350" r="4.5" fill="#a2a7b0" stroke="#333" stroke-width="1"/>
    <circle cx="250" cy="350" r="1.8" fill="#111"/>

    <!-- Sapphire Glare Reflection -->
    <path d="M 145 270 Q 250 220 355 270 A 128 128 0 0 0 145 270 Z" fill="#ffffff" opacity="0.14"/>
  </g>
</svg>
