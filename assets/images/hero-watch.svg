<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Vignette Background -->
    <radialGradient id="heroDarkBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="45%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <!-- Steel Bezel Gradient -->
    <linearGradient id="heroSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#a4abb5"/>
      <stop offset="50%" stop-color="#484d54"/>
      <stop offset="75%" stop-color="#d6dae0"/>
      <stop offset="100%" stop-color="#727780"/>
    </linearGradient>
    <radialGradient id="heroDialSunray" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242730"/>
      <stop offset="70%" stop-color="#101217"/>
      <stop offset="100%" stop-color="#060709"/>
    </radialGradient>
    <!-- Glass Light Beam -->
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#80d0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dramaticGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1920" height="1080" fill="url(#heroDarkBg)"/>

  <!-- Subtle Precision Geometric Grids in Background -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <circle cx="1250" cy="540" r="600"/>
    <circle cx="1250" cy="540" r="480"/>
    <circle cx="1250" cy="540" r="360"/>
    <line x1="650" y1="540" x2="1850" y2="540"/>
    <line x1="1250" y1="0" x2="1250" y2="1080"/>
  </g>

  <!-- Giant Macro Luxury Watch Timepiece on Right Side -->
  <g transform="translate(1220, 540) rotate(-12)" filter="url(#dramaticGlow)">
    <!-- Stainless Steel Bracelet Bands -->
    <path d="M -160 -650 L 160 -650 L 150 -260 L -150 -260 Z" fill="url(#heroSteel)" opacity="0.85"/>
    <path d="M -150 260 L 150 260 L 160 650 L -160 650 Z" fill="url(#heroSteel)" opacity="0.85"/>
    <line x1="-155" y1="-440" x2="155" y2="-440" stroke="#222" stroke-width="4"/>
    <line x1="-155" y1="440" x2="155" y2="440" stroke="#222" stroke-width="4"/>

    <!-- Tonneau PRX Style Heavy Case -->
    <path d="M -180 -320 C -180 -250 180 -250 180 -320 L 260 -120 C 295 -40 295 40 260 120 L 180 320 C 180 250 -180 250 -180 320 L -260 120 C -295 40 -295 -40 -260 -120 Z" 
          fill="url(#heroSteel)" stroke="#2a2e36" stroke-width="6"/>

    <!-- Pushers & Crown -->
    <rect x="270" y="-140" width="35" height="50" rx="8" fill="url(#heroSteel)"/>
    <path d="M 280 -40 L 325 -30 L 325 30 L 280 40 Z" fill="url(#heroSteel)" stroke="#222" stroke-width="2"/>
    <rect x="270" y="90" width="35" height="50" rx="8" fill="url(#heroSteel)"/>

    <!-- Massive Bezel -->
    <circle cx="0" cy="0" r="235" fill="url(#heroSteel)" stroke="#1a1d24" stroke-width="4"/>
    <circle cx="0" cy="0" r="215" fill="#0c0e12" stroke="#444" stroke-width="2"/>

    <!-- Dial Surface -->
    <circle cx="0" cy="0" r="208" fill="url(#heroDialSunray)"/>

    <!-- Tachymeter Scale Ring -->
    <circle cx="0" cy="0" r="195" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Subdials with Red Hands -->
    <circle cx="-85" cy="0" r="50" fill="#151820" stroke="#444955" stroke-width="1.5"/>
    <line x1="-85" y1="0" x2="-70" y2="-25" stroke="#DA291C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-85" cy="0" r="4" fill="#DA291C"/>

    <circle cx="85" cy="0" r="50" fill="#151820" stroke="#444955" stroke-width="1.5"/>
    <line x1="85" y1="0" x2="105" y2="-20" stroke="#DA291C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="85" cy="0" r="4" fill="#DA291C"/>

    <circle cx="0" cy="90" r="48" fill="#151820" stroke="#444955" stroke-width="1.5"/>
    <line x1="0" y1="90" x2="0" y2="58" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="90" r="4" fill="#fff"/>

    <!-- Brand Emblem on Dial -->
    <text x="0" y="-105" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">VOUVRY</text>
    <text x="0" y="-88" font-family="'Montserrat', sans-serif" font-size="9" font-weight="600" fill="#9da3af" text-anchor="middle" letter-spacing="4">GENÈVE 1888</text>

    <!-- Hour Markers -->
    <rect x="-6" y="-190" width="12" height="32" rx="2" fill="#ffffff" stroke="#c0c0c0" stroke-width="1"/>
    <rect x="158" y="-6" width="32" height="12" rx="2" fill="#ffffff" stroke="#c0c0c0" stroke-width="1"/>
    <rect x="-190" y="-6" width="32" height="12" rx="2" fill="#ffffff" stroke="#c0c0c0" stroke-width="1"/>

    <!-- Hands: Hour & Minute -->
    <polygon points="0,0 -80,-85 -75,-92 5,-5" fill="#f0f3f8" stroke="#333" stroke-width="1.5"/>
    <polygon points="-7,-7 -75,-80 -70,-85 0,0" fill="#ffffff"/>

    <polygon points="0,0 125,-105 120,-112 -5,-5" fill="#f0f3f8" stroke="#333" stroke-width="1.5"/>
    <polygon points="7,7 115,-98 110,-104 0,0" fill="#ffffff"/>

    <!-- Chronograph Central Red Second Needle -->
    <line x1="0" y1="50" x2="0" y2="-195" stroke="#DA291C" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="7" fill="#DA291C"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>

    <!-- Sapphire Reflection Angle Beam -->
    <polygon points="-180,-120 180,-200 120,200 -200,100" fill="url(#lightBeam)"/>
  </g>

  <!-- Light Flare Overlay -->
  <circle cx="1180" cy="480" r="260" fill="#ffffff" opacity="0.03" filter="url(#dramaticGlow)"/>
</svg>
