<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="steelBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cfd2d6"/>
      <stop offset="50%" stop-color="#8b9098"/>
      <stop offset="80%" stop-color="#e2e5e8"/>
      <stop offset="100%" stop-color="#9ca1a8"/>
    </linearGradient>
    <linearGradient id="dialSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="50%" stop-color="#f0f2f5"/>
      <stop offset="100%" stop-color="#d6dae0"/>
    </linearGradient>
    <radialGradient id="sunray" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#e8ecf0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cbd0d8" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d6c6"/>
      <stop offset="50%" stop-color="#e09f80"/>
      <stop offset="100%" stop-color="#b86f50"/>
    </linearGradient>
    <linearGradient id="braceletLink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0b5bc"/>
      <stop offset="15%" stop-color="#eef0f3"/>
      <stop offset="85%" stop-color="#bcc2c9"/>
      <stop offset="100%" stop-color="#8a9098"/>
    </linearGradient>
    <filter id="watchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#watchShadow)">
    <!-- Top Bracelet Links -->
    <path d="M 175 40 L 325 40 L 320 180 L 180 180 Z" fill="url(#braceletLink)" stroke="#7e848d" stroke-width="1.5"/>
    <line x1="176" y1="80" x2="324" y2="80" stroke="#717780" stroke-width="2"/>
    <line x1="178" y1="120" x2="322" y2="120" stroke="#717780" stroke-width="2"/>
    <line x1="179" y1="155" x2="321" y2="155" stroke="#717780" stroke-width="2"/>
    <rect x="220" y="40" width="60" height="140" fill="url(#steelBezel)" opacity="0.6"/>

    <!-- Bottom Bracelet Links -->
    <path d="M 180 520 L 320 520 L 325 660 L 175 660 Z" fill="url(#braceletLink)" stroke="#7e848d" stroke-width="1.5"/>
    <line x1="179" y1="545" x2="321" y2="545" stroke="#717780" stroke-width="2"/>
    <line x1="178" y1="580" x2="322" y2="580" stroke="#717780" stroke-width="2"/>
    <line x1="176" y1="620" x2="324" y2="620" stroke="#717780" stroke-width="2"/>
    <rect x="220" y="520" width="60" height="140" fill="url(#steelBezel)" opacity="0.6"/>

    <!-- Case Body & Lugs (Tissot PRX Tonneau Shape) -->
    <path d="M 160 210 C 160 170 340 170 340 210 L 370 280 C 385 320 385 380 370 420 L 340 490 C 340 530 160 530 160 490 L 130 420 C 115 380 115 320 130 280 Z" 
          fill="url(#steelBezel)" stroke="#5d636b" stroke-width="2"/>

    <!-- Pushers & Crown -->
    <rect x="382" y="295" width="16" height="22" rx="4" fill="url(#steelBezel)" stroke="#4d535b" stroke-width="1.5"/>
    <!-- Main Crown -->
    <path d="M 384 335 L 402 338 L 402 362 L 384 365 Z" fill="url(#steelBezel)" stroke="#4d535b" stroke-width="1.5"/>
    <line x1="390" y1="337" x2="390" y2="363" stroke="#2d333b" stroke-width="1"/>
    <line x1="395" y1="337" x2="395" y2="363" stroke="#2d333b" stroke-width="1"/>
    <!-- Bottom Pusher -->
    <rect x="382" y="385" width="16" height="22" rx="4" fill="url(#steelBezel)" stroke="#4d535b" stroke-width="1.5"/>

    <!-- Circular Outer Bezel -->
    <circle cx="250" cy="350" r="142" fill="url(#steelBezel)" stroke="#6c737d" stroke-width="2"/>
    <circle cx="250" cy="350" r="130" fill="#ffffff" stroke="#a0a5ad" stroke-width="1.5"/>

    <!-- Dial Surface with Sunray Finish -->
    <circle cx="250" cy="350" r="126" fill="url(#dialSilver)"/>
    <circle cx="250" cy="350" r="126" fill="url(#sunray)"/>

    <!-- Outer Minute Track -->
    <circle cx="250" cy="350" r="122" fill="none" stroke="#222226" stroke-width="0.8" opacity="0.6"/>
    <!-- 60 Minute Tick Marks (sample key ticks) -->
    <g stroke="#1a1a1c" stroke-width="1.5">
      <line x1="250" y1="228" x2="250" y2="236"/>
      <line x1="250" y1="464" x2="250" y2="472"/>
      <line x1="128" y1="350" x2="136" y2="350"/>
      <line x1="364" y1="350" x2="372" y2="350"/>
      <line x1="336" y1="264" x2="330" y2="270"/>
      <line x1="164" y1="436" x2="170" y2="430"/>
      <line x1="164" y1="264" x2="170" y2="270"/>
      <line x1="336" y1="436" x2="330" y2="430"/>
    </g>

    <!-- Subdial 1 (Left: 30-Minute Counter) -->
    <circle cx="195" cy="350" r="32" fill="#e8ebef" stroke="#aab0b8" stroke-width="1"/>
    <circle cx="195" cy="350" r="30" fill="none" stroke="#222" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="195" y1="350" x2="185" y2="335" stroke="#DA291C" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="195" cy="350" r="3" fill="#111"/>

    <!-- Subdial 2 (Right: 1/10th Second Counter) -->
    <circle cx="305" cy="350" r="32" fill="#e8ebef" stroke="#aab0b8" stroke-width="1"/>
    <circle cx="305" cy="350" r="30" fill="none" stroke="#222" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="305" y1="350" x2="315" y2="338" stroke="#DA291C" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="305" cy="350" r="3" fill="#111"/>

    <!-- Subdial 3 (Bottom: Running Seconds) -->
    <circle cx="250" cy="405" r="30" fill="#e8ebef" stroke="#aab0b8" stroke-width="1"/>
    <circle cx="250" cy="405" r="28" fill="none" stroke="#222" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="250" y1="405" x2="250" y2="385" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="250" cy="405" r="3" fill="#111"/>

    <!-- Brand Typography on Dial -->
    <text x="250" y="278" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#080808" text-anchor="middle" letter-spacing="2">VOUVRY</text>
    <text x="250" y="290" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#666" text-anchor="middle" letter-spacing="2.5">GENÈVE 1888</text>

    <!-- Date Window at 4 o'clock -->
    <rect x="315" y="385" width="22" height="15" fill="#ffffff" stroke="#888" stroke-width="1" rx="1.5"/>
    <text x="326" y="396" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#111" text-anchor="middle">28</text>

    <!-- Swiss Made at bottom -->
    <text x="250" y="458" font-family="'Montserrat', sans-serif" font-size="5" font-weight="600" fill="#444" text-anchor="middle" letter-spacing="2">SWISS MADE</text>

    <!-- Applied Rose Gold Hour Indices -->
    <rect x="247" y="234" width="6" height="20" rx="1.5" fill="url(#roseGold)" stroke="#9c5b3d" stroke-width="0.6"/>
    <rect x="344" y="347" width="20" height="6" rx="1.5" fill="url(#roseGold)" stroke="#9c5b3d" stroke-width="0.6"/>
    <rect x="136" y="347" width="20" height="6" rx="1.5" fill="url(#roseGold)" stroke="#9c5b3d" stroke-width="0.6"/>

    <!-- Main Hands (Hour & Minute in Rose Gold / Lume) -->
    <!-- Hour Hand pointing to 10:10 -->
    <polygon points="250,350 200,300 203,296 252,348" fill="url(#roseGold)" stroke="#8c4e33" stroke-width="0.8"/>
    <polygon points="247,347 206,306 208,304 249,345" fill="#ffffff"/>

    <!-- Minute Hand pointing to 10:10 (2 o'clock / 10 past) -->
    <polygon points="250,350 328,290 325,286 248,348" fill="url(#roseGold)" stroke="#8c4e33" stroke-width="0.8"/>
    <polygon points="252,347 320,296 318,293 250,344" fill="#ffffff"/>

    <!-- Central Chronograph Red Seconds Hand -->
    <line x1="250" y1="375" x2="250" y2="238" stroke="#DA291C" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="250" cy="350" r="5" fill="#DA291C"/>
    <circle cx="250" cy="350" r="2" fill="#ffffff"/>
    <circle cx="250" cy="370" r="3" fill="#DA291C"/>

    <!-- Glass Sapphire Glare Reflection -->
    <path d="M 145 270 Q 250 220 355 270 A 126 126 0 0 0 145 270 Z" fill="#ffffff" opacity="0.14"/>
  </g>
</svg>
