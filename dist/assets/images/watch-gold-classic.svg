<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Rich 18K Yellow Gold Gradients -->
    <linearGradient id="goldCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="25%" stop-color="#eec765"/>
      <stop offset="50%" stop-color="#bb8d28"/>
      <stop offset="75%" stop-color="#f5d57a"/>
      <stop offset="100%" stop-color="#a47517"/>
    </linearGradient>
    <linearGradient id="goldBracelet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c99d32"/>
      <stop offset="20%" stop-color="#fce69a"/>
      <stop offset="80%" stop-color="#bb8d28"/>
      <stop offset="100%" stop-color="#8c6516"/>
    </linearGradient>
    <!-- Tapisserie Waffle Grid for Dial -->
    <pattern id="wafflePattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#141416"/>
      <rect x="1" y="1" width="8" height="8" fill="#202126" stroke="#08080a" stroke-width="0.7"/>
    </pattern>
    <filter id="watchShadowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#watchShadowGold)">
    <!-- Top Gold Bracelet -->
    <path d="M 175 40 L 325 40 L 320 180 L 180 180 Z" fill="url(#goldBracelet)" stroke="#8c6516" stroke-width="1.5"/>
    <line x1="176" y1="75" x2="324" y2="75" stroke="#7a550d" stroke-width="2"/>
    <line x1="178" y1="110" x2="322" y2="110" stroke="#7a550d" stroke-width="2"/>
    <line x1="179" y1="145" x2="321" y2="145" stroke="#7a550d" stroke-width="2"/>
    <rect x="220" y="40" width="60" height="140" fill="url(#goldCase)" opacity="0.6"/>

    <!-- Bottom Gold Bracelet -->
    <path d="M 180 520 L 320 520 L 325 660 L 175 660 Z" fill="url(#goldBracelet)" stroke="#8c6516" stroke-width="1.5"/>
    <line x1="179" y1="550" x2="321" y2="550" stroke="#7a550d" stroke-width="2"/>
    <line x1="178" y1="585" x2="322" y2="585" stroke="#7a550d" stroke-width="2"/>
    <line x1="176" y1="625" x2="324" y2="625" stroke="#7a550d" stroke-width="2"/>
    <rect x="220" y="520" width="60" height="140" fill="url(#goldCase)" opacity="0.6"/>

    <!-- Case Body & Lugs (18K Gold Tonneau) -->
    <path d="M 160 210 C 160 170 340 170 340 210 L 370 280 C 385 320 385 380 370 420 L 340 490 C 340 530 160 530 160 490 L 130 420 C 115 380 115 320 130 280 Z" 
          fill="url(#goldCase)" stroke="#7a550d" stroke-width="2"/>

    <!-- Crown at 3 o'clock -->
    <path d="M 384 335 L 402 338 L 402 362 L 384 365 Z" fill="url(#goldCase)" stroke="#7a550d" stroke-width="1.5"/>
    <line x1="390" y1="337" x2="390" y2="363" stroke="#5a3d07" stroke-width="1"/>
    <line x1="395" y1="337" x2="395" y2="363" stroke="#5a3d07" stroke-width="1"/>

    <!-- Circular Outer Gold Bezel -->
    <circle cx="250" cy="350" r="142" fill="url(#goldCase)" stroke="#8c6516" stroke-width="2"/>
    <circle cx="250" cy="350" r="130" fill="#fce69a" stroke="#a47517" stroke-width="1.5"/>

    <!-- Black Waffle Dial Surface -->
    <circle cx="250" cy="350" r="126" fill="url(#wafflePattern)"/>

    <!-- Outer Gold Minute Track -->
    <circle cx="250" cy="350" r="122" fill="none" stroke="#eec765" stroke-width="0.8" opacity="0.5"/>

    <!-- Brand Typography on Dial -->
    <text x="250" y="275" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#fdf0b8" text-anchor="middle" letter-spacing="2">VOUVRY</text>
    <text x="250" y="287" font-family="'Montserrat', sans-serif" font-size="7" font-weight="600" fill="#eec765" text-anchor="middle" letter-spacing="2.5">1888</text>
    <text x="250" y="420" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="700" fill="#eec765" text-anchor="middle" letter-spacing="2">POWERMATIC 80</text>

    <!-- Date Window at 3 o'clock -->
    <rect x="328" y="342" width="24" height="16" fill="#141416" stroke="#bb8d28" stroke-width="1.2" rx="1"/>
    <text x="340" y="354" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#fce69a" text-anchor="middle">18</text>

    <!-- Swiss Made at bottom -->
    <text x="250" y="458" font-family="'Montserrat', sans-serif" font-size="5.5" font-weight="600" fill="#c99d32" text-anchor="middle" letter-spacing="2">SWISS MADE</text>

    <!-- Applied 18K Gold Faceted Hour Markers -->
    <!-- 12 o'clock double bar -->
    <rect x="246" y="234" width="3.5" height="18" rx="1" fill="url(#goldCase)" stroke="#7a550d" stroke-width="0.5"/>
    <rect x="251.5" y="234" width="3.5" height="18" rx="1" fill="url(#goldCase)" stroke="#7a550d" stroke-width="0.5"/>
    <!-- 6 o'clock -->
    <rect x="248" y="446" width="4" height="18" rx="1" fill="url(#goldCase)" stroke="#7a550d" stroke-width="0.5"/>
    <!-- 9 o'clock -->
    <rect x="134" y="348" width="18" height="4" rx="1" fill="url(#goldCase)" stroke="#7a550d" stroke-width="0.5"/>
    <!-- Radial Markers -->
    <rect x="330" y="270" width="16" height="4" rx="1" transform="rotate(30 338 272)" fill="url(#goldCase)"/>
    <rect x="348" y="306" width="16" height="4" rx="1" transform="rotate(60 356 308)" fill="url(#goldCase)"/>
    <rect x="348" y="388" width="16" height="4" rx="1" transform="rotate(120 356 390)" fill="url(#goldCase)"/>
    <rect x="330" y="426" width="16" height="4" rx="1" transform="rotate(150 338 428)" fill="url(#goldCase)"/>
    <rect x="154" y="426" width="16" height="4" rx="1" transform="rotate(-150 162 428)" fill="url(#goldCase)"/>
    <rect x="136" y="388" width="16" height="4" rx="1" transform="rotate(-120 144 390)" fill="url(#goldCase)"/>
    <rect x="136" y="306" width="16" height="4" rx="1" transform="rotate(-60 144 308)" fill="url(#goldCase)"/>
    <rect x="154" y="270" width="16" height="4" rx="1" transform="rotate(-30 162 272)" fill="url(#goldCase)"/>

    <!-- Main Baton Hands in 18K Gold with Lume Strip -->
    <!-- Hour Hand pointing to 10:10 -->
    <polygon points="250,350 200,300 203,296 252,348" fill="url(#goldCase)" stroke="#7a550d" stroke-width="0.8"/>
    <polygon points="247,347 206,306 208,304 249,345" fill="#fdf0b8"/>

    <!-- Minute Hand -->
    <polygon points="250,350 328,290 325,286 248,348" fill="url(#goldCase)" stroke="#7a550d" stroke-width="0.8"/>
    <polygon points="252,347 320,296 318,293 250,344" fill="#fdf0b8"/>

    <!-- Ultra-slender Gold Seconds Hand -->
    <line x1="250" y1="375" x2="250" y2="236" stroke="#fce69a" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="250" cy="350" r="4.5" fill="url(#goldCase)"/>
    <circle cx="250" cy="350" r="1.8" fill="#141416"/>

    <!-- Sapphire Reflection -->
    <path d="M 145 270 Q 250 220 355 270 A 126 126 0 0 0 145 270 Z" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
